<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aurora Livros</title>
    <link rel="stylesheet" href="style/contato.css">
    <link rel="icon" href="style/icons/logo-tab.svg">
</head>

<body>
    <nav id="nav-container">
        <div id="nav-logo">
            <a id="logo-container" href="">
                <img id="logo" src="style/icons/logo.svg" alt="Aurora Livros">
                <p>Aurora Livros</p>
            </a>
        </div>
        <div id="nav-pages">
            <a href="index.html">
                <button>Início</button>
            </a>
            <a>
                <button>Catálogo</button>
            </a>
            <a>
                <button>Autores</button>
            </a>
            <a href="contato.html" aria-current="page">
                <button>Contato</button>
            </a>
        </div>
        <div id="nav-actions">
            <button class="nav-actions-buttons">
                <img id="fav-icon" src="style/icons/favorites.svg" alt="">
            </button>
            <button class="nav-actions-buttons">
                <img src="style/icons/bag.svg" alt="">
            </button>
            <button class="nav-actions-buttons nav-actions-accessbility">Aa</button>
        </div>
    </nav>
    <main id="contact">
        <section id="contact-info">
            <p id="contact-eyebrow">Entre em contato conosco</p>
            <h1 id="contact-title">Vamos conversar?</h1>
            <p id="contact-text">Dúvidas, sugestões ou apenas vontade de falar sobre livros. Escreva para nós.</p>
            <hr>
            <div class="contact-info__item">
                <p class="contact-info__label">E-mail:</p>
                <p>contato@auroralivros.com</p>
            </div>
            <div class="contact-info__item">
                <p class="contact-info__label">Atendimento:</p>
                <p>Segunda a Sexta, das 9h às 18h</p>
            </div>
        </section>
        <form id="contact-form" action="">
            <div class="float-field">
                <input class="float-field__input" type="text" id="nome" name="nome" placeholder=" " required>
                <label class="float-field__label" for="nome">Nome</label>
            </div>

            <div class="float-field">
                <input class="float-field__input" type="email" id="email" name="email" placeholder=" " required>
                <label class="float-field__label" for="email">E-mail</label>
            </div>

            <div class="float-field">
                <select class="float-field__input" id="subject" name="subject" required>
                    <option value="" disabled selected>Selecione o assunto</option>
                    <option value="pedido">Pedido</option>
                    <option value="indicacao">Indicação de livro</option>
                    <option value="reclamacao">Reclamação</option>
                    <option value="outro">Outro</option>
                </select>
                <label class="float-field__label" for="subject">Assunto</label>
            </div>

            <div class="float-field">
                <textarea class="float-field__input float-field__input--textarea" id="mensagem" name="mensagem"
                    placeholder=" " required></textarea>
                <label class="float-field__label float-field__label--textarea" for="mensagem">Mensagem</label>
            </div>
            <button id="contato-enviar" type="submit">
                <span>Enviar Mensagem</span>
                <img src="style/icons/right-arrow-light.svg" alt="">
            </button>
        </form>
    </main>
</body>
