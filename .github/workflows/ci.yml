name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biblioteca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: biblioteca

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compila o back-end
        run: python -m py_compile app.py

      - name: Aplica schema e seed
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d biblioteca -f schema.sql
          psql -h 127.0.0.1 -U postgres -d biblioteca -f seed.sql

      - name: Sobe a API e testa as rotas
        run: |
          python app.py > /tmp/app.log 2>&1 &
          sleep 4
          curl -sf http://127.0.0.1:5000/api/health
          curl -sf http://127.0.0.1:5000/api/books | grep -q "O Jardim Secreto"
          curl -sf "http://127.0.0.1:5000/api/books?category=misterio" | grep -q "O Nome da Rosa"
          curl -sf http://127.0.0.1:5000/covers/o-jardim-secreto.svg | grep -q "<svg"
          curl -sf -o /dev/null -w "index: %{http_code}\n" http://127.0.0.1:5000/
